<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Produtos | Ressignificar</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div class="carregando" id="carregando">Carregando...</div>
<div id="painel" hidden>
  <header class="topo-painel">
    <div class="marca"><img src="img/logo.png" alt=""><b>Ressignificar</b></div>
    <div class="usuario">
      <span data-nome-usuario></span>
      <a class="lnk" href="conta.html">Minha conta</a>
      <button class="sair" data-sair>Sair</button>
    </div>
  </header>
  <main class="conteudo-painel largo">
    <a class="voltar" href="painel-cliente.html">← Voltar ao painel</a>
    <h1>Produtos</h1>
    <p class="sub">O que você já tem e os próximos passos que podem fazer sentido para você.</p>

    <div class="cartao"><h2>Seus produtos</h2><div class="vitrine" id="meus"></div></div>
    <div class="cartao"><h2>Recomendados para você</h2><div class="vitrine" id="ofertas"></div></div>
  </main>
</div>

<dialog class="janela" id="janelaInt">
  <h2 id="intTitulo">Quero saber mais</h2>
  <p class="ajuda">O Mauricio recebe o seu interesse e o WhatsApp abre com a mensagem pronta.</p>
  <div class="f"><label for="intMsg">Quer contar algo? <span class="vazio">(opcional)</span></label><textarea id="intMsg" rows="3" maxlength="400" placeholder="Ex.: queria entender se cabe no meu momento"></textarea></div>
  <div class="acoes"><button class="btn auto" type="button" id="intEnviar">Enviar interesse</button><button class="btn auto contorno" type="button" id="intCancelar">Cancelar</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/i18n.js"></script>
<script>
(async function () {
  const eu = await protegerPagina("cliente");
  if (!eu) return;
  const [rp, rv, ri, rc] = await Promise.all([
    supa().from("catalogo_produtos").select("id,nome,servico,descricao,inclui,preco_texto,link_pagamento,destaque,ativo,ordem").order("ordem").order("nome"),
    supa().from("cliente_produtos").select("produto_id,situacao,desde").eq("perfil_id", eu.id),
    supa().from("interesses").select("produto_id,status,criado_em").eq("perfil_id", eu.id).order("criado_em", { ascending: false }),
    supa().from("config_publica").select("valor").eq("chave", "whatsapp_contato").maybeSingle()
  ]);
  const produtos = rp.data || [], vinc = rv.data || [], ints = ri.data || [];
  const whats = rc.data ? rc.data.valor : "";
  const tem = function (id) { return vinc.find(function (v) { return v.produto_id === id && v.situacao === "adquirido"; }); };
  const meus = produtos.filter(function (p) { return tem(p.id); });
  const ofertas = produtos.filter(function (p) { return p.ativo && !tem(p.id); })
    .sort(function (a, b) {
      const oa = vinc.some(function (v) { return v.produto_id === a.id; }) ? 0 : 1, ob = vinc.some(function (v) { return v.produto_id === b.id; }) ? 0 : 1;
      return oa - ob || (b.destaque ? 1 : 0) - (a.destaque ? 1 : 0) || a.ordem - b.ordem;
    });

  function cartao(p, meu) {
    const itens = (p.inclui || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    const intAberto = ints.find(function (i) { return i.produto_id === p.id && (i.status === "novo" || i.status === "em_conversa"); });
    const v = tem(p.id);
    return '<div class="produto' + (p.destaque && !meu ? " destaque" : "") + '">' +
      (p.servico ? '<span class="rotulo">' + ROTULO_SERVICO[p.servico] + "</span>" : "") +
      "<b>" + esc(p.nome) + "</b>" +
      (p.descricao ? "<p>" + esc(p.descricao) + "</p>" : "") +
      (itens.length ? '<ul class="inclui">' + itens.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "") +
      (meu ? '<span class="selo ok" style="align-self:flex-start">Você tem desde ' + dataBR(v.desde) + "</span>" :
        (p.preco_texto ? '<div class="preco">' + esc(p.preco_texto) + "</div>" : "") +
        '<div class="acoes" style="margin-top:auto">' +
        (intAberto ? '<span class="selo ok">Interesse enviado em ' + dataBR(intAberto.criado_em) + "</span>"
          : '<button class="btn auto" type="button" data-quero="' + p.id + '">Quero saber mais</button>') +
        (p.link_pagamento ? '<a class="btn auto contorno" href="' + esc(p.link_pagamento) + '" target="_blank" rel="noopener">Comprar agora</a>' : "") +
        "</div>") + "</div>";
  }
  document.getElementById("meus").innerHTML = meus.length ? meus.map(function (p) { return cartao(p, true); }).join("") : '<p class="vazio">Seus produtos aparecem aqui.</p>';
  document.getElementById("ofertas").innerHTML = ofertas.length ? ofertas.map(function (p) { return cartao(p, false); }).join("") : '<p class="vazio">Nenhuma recomendação no momento.</p>';

  const janela = document.getElementById("janelaInt");
  let escolhido = null;
  document.getElementById("ofertas").addEventListener("click", function (e) {
    const b = e.target.closest("[data-quero]"); if (!b) return;
    escolhido = produtos.find(function (p) { return p.id === b.dataset.quero; });
    document.getElementById("intTitulo").textContent = escolhido.nome;
    document.getElementById("intMsg").value = "";
    janela.showModal();
  });
  document.getElementById("intCancelar").addEventListener("click", function () { janela.close(); });
  document.getElementById("intEnviar").addEventListener("click", async function () {
    if (!escolhido) return;
    const msg = document.getElementById("intMsg").value.trim();
    const aba = whats ? window.open("about:blank", "_blank") : null;
    const { error } = await supa().from("interesses").insert({ perfil_id: eu.id, produto_id: escolhido.id, mensagem: msg || null });
    if (error) { if (aba) aba.close(); aviso("Não foi possível enviar. Tente de novo.", true); return; }
    janela.close();
    aviso("Interesse enviado ao Mauricio.");
    if (aba) {
      const texto = "Olá, Mauricio! Sou " + eu.nome + " e tenho interesse em " + escolhido.nome + "." + (msg ? " " + msg : "");
      aba.location.href = "https://wa.me/" + whats + "?text=" + encodeURIComponent(texto);
    }
    setTimeout(function () { location.reload(); }, 1200);
  });
})();
</script>
</body>
</html>
