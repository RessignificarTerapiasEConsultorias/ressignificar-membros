<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar | Área de Membros — Ressignificar</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div class="tela-login">
  <div class="cartao-login">
    <div class="marca-login">
      <img src="img/logo.png" alt="">
      <span><b>Ressignificar</b><span>Área de Membros</span></span>
    </div>
    <form id="formLogin" novalidate>
      <label class="campo"><span>E-mail</span><input type="email" id="campoEmail" autocomplete="username" required></label>
      <label class="campo"><span>Senha</span><input type="password" id="campoSenha" autocomplete="current-password" required></label>
      <div id="avisoLogin"></div>
      <button class="btn" type="submit" id="botaoEntrar">Entrar</button>
    </form>
    <p class="nota-login">Acesso apenas para convidados. Se você ainda não recebeu seu login, fale com o Mauricio.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
(function(){
  const form = document.getElementById("formLogin");
  const botao = document.getElementById("botaoEntrar");
  const aviso = document.getElementById("avisoLogin");

  // e-mail preenchido só quando a pessoa chega pelo link da área dela (ex.: site do Teste de Travas)
  const emailDoLink = new URLSearchParams(location.search).get("email");
  if (emailDoLink && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailDoLink)) {
    document.getElementById("campoEmail").value = emailDoLink.trim().toLowerCase();
    document.getElementById("campoSenha").focus();
  }

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    aviso.innerHTML = "";
    botao.disabled = true; botao.textContent = "Entrando...";
    const email = document.getElementById("campoEmail").value.trim();
    const senha = document.getElementById("campoSenha").value;
    const r = await fazerLogin(email, senha);
    if (!r.ok){
      aviso.innerHTML = '<p class="aviso erro">' + r.erro + '</p>';
      botao.disabled = false; botao.textContent = "Entrar";
      return;
    }
    const destino = PAINEL_DO_PAPEL[r.papel];
    location.href = destino || "painel-cliente.html";
  });

  // já logado? pula direto pro painel
  (async function(){
    const { data: { session } } = await supa().auth.getSession();
    if (!session) return;
    const perfil = await buscarPerfilLogado();
    if (perfil) location.href = PAINEL_DO_PAPEL[perfil.papel] || "index.html";
  })();
})();
</script>
</body>
</html>
