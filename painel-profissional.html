<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meus pacientes | Ressignificar</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div class="carregando" id="carregando">Carregando...</div>
<div id="painel" hidden>
  <header class="topo-painel">
    <div class="marca"><img src="img/logo.png" alt=""><b>Ressignificar</b></div>
    <div class="usuario">
      <span data-nome-usuario></span>
      <a class="lnk" href="conta.html">Minha conta</a>
      <button class="sair" data-sair>Sair</button>
    </div>
  </header>
  <main class="conteudo-painel largo">
    <h1 id="ola">Meus pacientes</h1>
    <p class="sub" id="semClinica" hidden>Seu acesso ainda não foi ligado a nenhuma clínica. Avise o responsável para liberar.</p>

    <div id="area" hidden>
      <div class="cartao">
        <div class="barra-periodo f" style="align-items:center;gap:12px">
          <button class="btn peq contorno" type="button" id="mesAnteriorAgenda">‹</button>
          <b id="tituloMesAgenda" style="font-size:17px;min-width:160px;text-align:center"></b>
          <button class="btn peq contorno" type="button" id="mesProximoAgenda">›</button>
        </div>
        <div class="calendario-fluxo" id="calendarioAgenda" style="margin-top:12px"></div>
      </div>
      <div class="cartao" style="margin-top:14px">
        <h2>Próximas sessões</h2>
        <div id="listaProximas"></div>
      </div>
      <div class="cartao" style="margin-top:14px">
        <h2>Meus pacientes</h2>
        <div id="listaPacientes"></div>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/painel-profissional.js"></script>
</body>
</html>
